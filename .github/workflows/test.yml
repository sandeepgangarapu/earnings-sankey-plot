name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python -m earnings_sankey --sample --output /tmp/sample.html --svg-output /tmp/sample.svg
        env:
          PYTHONPATH: src
