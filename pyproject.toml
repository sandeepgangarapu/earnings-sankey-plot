[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-sankey"
version = "0.1.1"
description = "Turn public SEC earnings data into consistent income-statement Sankey diagrams."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sandeep Gangarapu" }]
dependencies = []

[project.scripts]
earnings-sankey = "earnings_sankey.cli:main"
earnings-sankey-server = "earnings_sankey.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
